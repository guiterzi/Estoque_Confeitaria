<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cliente - Formulário</title>
</head>
<body>
<h1 th:text="${cliente.id} != null ? 'Editar Cliente' : 'Novo Cliente'"></h1>

<!-- Formulário Novo Cliente -->
<form th:if="${cliente.id} == null"
      th:action="@{/clientes}" method="post" th:object="${cliente}">
    <label for="nome">Nome:</label>
    <input th:field="*{nome}" id="nome" type="text" required><br>

    <label for="email">Email:</label>
    <input th:field="*{email}" id="email" type="email" required><br>

    <label for="idade">Idade:</label>
    <input th:field="*{idade}" id="idade" type="number"><br>

    <!-- Erros de validação -->
    <div th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
    <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
    <div th:if="${#fields.hasErrors('idade')}" th:errors="*{idade}"></div>

    <button type="submit">Cadastrar</button>
    <a th:href="@{/clientes}">Cancelar</a>
</form>

<!-- Formulário Editar Cliente -->
<form th:if="${cliente.id} != null"
      th:action="@{/clientes/{id}(id=${cliente.id})}" method="post" th:object="${cliente}">
    <input type="hidden" name="_method" value="put"/>

    <label for="nome">Nome:</label>
    <input th:field="*{nome}" id="nome" type="text" required><br>

    <label for="email">Email:</label>
    <input th:field="*{email}" id="email" type="email" required><br>

    <label for="idade">Idade:</label>
    <input th:field="*{idade}" id="idade" type="number"><br>

    <!-- Erros de validação -->
    <div th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"></div>
    <div th:if="${#fields.hasErrors('email')}" th:errors="*{email}"></div>
    <div th:if="${#fields.hasErrors('idade')}" th:errors="*{idade}"></div>

    <button type="submit">Atualizar</button>
    <a th:href="@{/clientes}">Cancelar</a>
</form>
</body>
</html>
