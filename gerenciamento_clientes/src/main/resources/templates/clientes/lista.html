<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Clientes - Lista</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
</head>
<body class="container mt-4">
<h1 class="text-primary">Clientes</h1>

<!-- Mensagem de sucesso -->
<p th:if="${msg}" th:text="${msg}" class="alert alert-success"></p>

<p><a th:href="@{/clientes/novo}" class="btn btn-success">Novo Cliente</a></p>

<!-- Tabela de clientes -->
<table class="table table-bordered table-striped">
    <thead class="table-dark">
    <tr>
        <th>Nome</th>
        <th>Email</th>
        <th>Idade</th>
        <th>Ações</th>
    </tr>
    <tr th:each="c : ${clientes}">
        <td th:text="${c.nome}"></td>
        <td th:text="${c.email}"></td>
        <td th:text="${c.idade}"></td>
        <td>
            <a th:href="@{/clientes/editar/{id}(id=${c.id})}" class="btn btn-warning btn-sm">Editar</a>
            <form th:action="@{/clientes/{id}(id=${c.id})}" method="post" style="display:inline">
                <input type="hidden" name="_method" value="delete"/>
                <button type="submit" class="btn btn-danger btn-sm">Excluir</button>
            </form>
        </td>
    </tr>
</table>
</body>
</html>
